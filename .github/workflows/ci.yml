name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  ai-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: AI docs must not be tracked
        run: |
          if git ls-files ai-docs | grep -q .; then
            echo "::error::ai-docs/ is checked in; delete it before merging."
            git ls-files ai-docs
            exit 1
          fi
